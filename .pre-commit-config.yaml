# Git hooks, run by prek (pre-commit compatible). Install: `prek install` (done once per clone).
# Backend hooks (ruff, pyright in backend/) and frontend hooks (ESLint, Prettier, tsc) run on the whole part.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-yaml
        # Reason: pnpm 12 writes frontend/pnpm-lock.yaml as two YAML documents.
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(backend/migrations/versions/|frontend/src/api/generated/)
      - id: trailing-whitespace
        exclude: ^(backend/migrations/versions/|frontend/src/api/generated/)

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (harness python)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(scripts/|\.claude/)
      - id: ruff-format
        name: ruff format (harness python)
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(scripts/|\.claude/)
      - id: pyright
        name: pyright (harness python)
        entry: uv run pyright
        language: system
        types: [python]
        files: ^(scripts/|\.claude/)
        pass_filenames: false
      - id: doc-links
        name: doc links
        entry: uv run --no-project python scripts/check_doc_links.py .
        language: system
        files: ^(.*\.md|\.claude/.*)$
      - id: doc-facts
        name: doc facts
        entry: uv run --no-project python scripts/check_doc_facts.py .
        language: system
        files: ^(.*\.md|\.claude/.*)$
        # Same scope as `just check`: rules and skills name planned paths by design.
        pass_filenames: false
      - id: journal-guard
        name: journal guard (committed notes are append-only)
        entry: uv run --no-project python .claude/hooks/protect_journal.py --git-staged
        language: system
        always_run: true
        pass_filenames: false
      - id: conventional-commit
        name: conventional commit message
        entry: uv run --no-project python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
      - id: backend-ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: backend-ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: backend-pyright
        name: pyright (backend)
        entry: uv run --directory backend pyright
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: frontend-eslint
        name: eslint (frontend)
        entry: pnpm --dir frontend lint --max-warnings 0
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: frontend-prettier
        name: prettier (frontend)
        entry: pnpm --dir frontend format
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-tsc
        name: tsc (frontend)
        entry: pnpm --dir frontend typecheck
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
