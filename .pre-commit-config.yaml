# Git hooks, run by prek (pre-commit compatible). Install: `prek install` (done once per clone).
# Backend and frontend hooks (ruff in backend/, eslint, prettier, tsc) are added by task 0.1.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(backend/migrations/versions/|frontend/src/api/generated/)
      - id: trailing-whitespace
        exclude: ^(backend/migrations/versions/|frontend/src/api/generated/)

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (harness python)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(scripts/|\.claude/)
      - id: ruff-format
        name: ruff format (harness python)
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(scripts/|\.claude/)
      - id: pyright
        name: pyright (harness python)
        entry: uv run pyright
        language: system
        types: [python]
        files: ^(scripts/|\.claude/)
        pass_filenames: false
      - id: doc-links
        name: doc links
        entry: uv run --no-project python scripts/check_doc_links.py .
        language: system
        files: ^(.*\.md|\.claude/.*)$
      - id: doc-facts
        name: doc facts
        entry: uv run --no-project python scripts/check_doc_facts.py .
        language: system
        files: ^(.*\.md|\.claude/.*)$
        # Same scope as `just check`: rules and skills name planned paths by design.
        pass_filenames: false
      - id: journal-guard
        name: journal guard (committed notes are append-only)
        entry: uv run --no-project python .claude/hooks/protect_journal.py --git-staged
        language: system
        always_run: true
        pass_filenames: false
      - id: conventional-commit
        name: conventional commit message
        entry: uv run --no-project python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
