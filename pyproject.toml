# Root project: the product version and the dev tooling for the harness scripts
# (scripts/, .claude/hooks/, .claude/skills/*/scripts/). The backend gets its own
# pyproject.toml in backend/ with task 0.1.
[project]
name = "vibecoding"
version = "0.1.0" # the product version: changed only by /release
description = "Email sentiment analysis: an opinion of each counterparty, built from the correspondence."
requires-python = ">=3.12"

[dependency-groups]
dev = ["ruff>=0.14", "pyright>=1.1.400"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["scripts/**/*.py", ".claude/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "T20", "C90"]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 14
max-statements = 60

[tool.pyright]
include = ["scripts", ".claude/hooks", ".claude/skills"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingModuleSource = false
