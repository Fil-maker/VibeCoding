schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English. User-visible UI texts are Russian and quoted exactly.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: an app that analyses the sentiment of emails so that nobody has to form an opinion of a
  counterparty by hand; every assessment is explained by the emails and phrases it rests on. Users:
  employees of an organization and its administrator. Read CLAUDE.md first; docs map: docs/README.md.
  Stack: Python + FastAPI backend (uv, pytest, ruff, pyright strict, SQLAlchemy + Alembic), React +
  TypeScript SPA (Vite, pnpm, Vitest) with an API client generated from OpenAPI, PostgreSQL in Docker,
  just. Details: docs/architecture.md, docs/tech.md; why: docs/decisions.md and docs/adr/.
  Product invariants (never trade them away): (1) explainable verdicts - every assessment links to the
  emails and phrases it rests on; (2) the mailbox is read-only - never send, delete or modify emails;
  (3) reproducible assessments - the same emails and settings give the same assessment, and a change of
  the analysis model is visible in the result; (4) the history of interaction with each counterparty is
  kept, and the administrator sees all correspondence of the organization; (5) access boundary - an
  employee sees only their own correspondence, the administrator all of their organization, and email
  text goes to a third-party service only with the administrator's consent.
  Requirements: openspec/specs/<capability>/spec.md, map in docs/domain.md «Requirements map».
  Glossary: docs/domain.md «Glossary»; use its terms.
  Work items come from docs/plan.md tasks with «Done when».

rules:
  proposal:
    - "Name the change after the plan task, dots as dashes (task 1.9 -> 1-9-<slug>); a bug fix outside the plan is fix-<slug>."
    - "Cite the plan task and its FR numbers. List what is out of scope; deferred items go to docs/ideas.md."
    - "Name the product invariants the change touches, or write that it touches none; touching one needs the user's decision first."
  specs:
    - "Before writing a delta, read the capability's current spec (openspec show <capability> --type spec) and the neighbouring requirements that need MODIFIED."
    - "Every requirement name starts with its stable number, FR-N <name>; a new requirement takes the next free number."
    - "MODIFIED copies the whole requirement with every scenario and keeps their names; when a scenario must go away, the requirement becomes REMOVED plus ADDED with a new number."
    - "Describe behavior without libraries, tables or file names; scenarios use concrete values, glossary terms and negative cases (another user's correspondence, an employee versus the administrator, empty input, a repeated action)."
  design:
    - "Follow docs/architecture.md and .claude/rules/; record decisions with alternatives and reasons."
    - "For a schema change, describe how existing data survives the migration and how to roll back."
    - "When the change has code with scenarios, add a section Interface: the public contract tests and code are written against; never SQL, private names or how a value is computed."
  tasks:
    - "Every task ends with its own check, written as check - <how>."
    - "Each group with code has a task for the scenario tests; copy the plan task's Done when items as the last group."
    - "End with a group Verification: just check, /test and the manual check steps."

operations:
  archive:
    guidance:
      - "A new FR number goes into the docs/domain.md header and Requirements map; a removed one into Cancelled numbers."
