# The backend application. Product version lives in the root pyproject.toml.
[project]
name = "vibecoding-backend"
version = "0.0.0"
description = "Backend of VibeCoding: FastAPI, PostgreSQL."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.161,<0.162",
    "uvicorn>=0.54,<0.55",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "psycopg[binary]>=3.3,<3.4",
    "alembic>=1.20,<1.21",
    "argon2-cffi>=25,<26",
    "aiosmtplib>=5,<6",
]

[dependency-groups]
dev = [
    "ruff>=0.17,<0.18",
    "pyright>=1.1.414,<1.2",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<0.29",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "T20", "C90", "TID", "ASYNC"]
# The UI and the spec quotes are Russian: Cyrillic letters are text, not look-alikes of Latin ones.
allowed-confusables = ["А", "Б", "В", "Г", "Д", "Е", "Ж", "З", "И", "Й", "К", "Л", "М", "Н", "О", "П", "Р", "С", "Т", "У", "Ф", "Х", "Ц", "Ч", "Ш", "Щ", "Ъ", "Ы", "Ь", "Э", "Ю", "Я", "а", "б", "в", "г", "д", "е", "ж", "з", "и", "й", "к", "л", "м", "н", "о", "п", "р", "с", "т", "у", "ф", "х", "ц", "ч", "ш", "щ", "ъ", "ы", "ь", "э", "ю", "я", "Ё", "ё"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 14
max-statements = 60

[tool.pyright]
include = ["app", "tests", "migrations"]
exclude = ["migrations/versions"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app", "tests"]
pythonpath = ["."]
